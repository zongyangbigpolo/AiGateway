name: Build AiGateway

on:
  workflow_dispatch:
    inputs:
      invitation_service_url:
        description: 'Operator setting baked into the APK; customers never enter this URL'
        required: true
        type: string
        default: 'https://47.103.58.159'
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  debug:
    name: Test and build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_INVITATION_SERVICE_URL: ${{ inputs.invitation_service_url || 'https://47.103.58.159' }}
    outputs:
      version: ${{ steps.package.outputs.version }}
      universal_file: ${{ steps.package.outputs.universal_file }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      signing_mode: ${{ steps.signing.outputs.mode || 'ephemeral' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate operator service URL
        run: |
          python3 - <<'PY'
          import importlib.util
          import os

          spec = importlib.util.spec_from_file_location("invitation_server", "invitation-service/server.py")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.validate_base_url(os.environ["ORG_GRADLE_PROJECT_INVITATION_SERVICE_URL"])
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865'

      - name: Prepare pinned native dependencies
        run: bash scripts/prepare-native.sh

      - name: Prepare pinned geodata
        run: bash scripts/prepare-geodata.sh

      - name: Test invitation service
        run: python3 -m unittest discover -s invitation-service/tests -p 'test_*.py'

      - name: Restore optional project debug signing key
        id: signing
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          AI_GATEWAY_DEBUG_KEYSTORE_BASE64: ${{ secrets.AI_GATEWAY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$AI_GATEWAY_DEBUG_KEYSTORE_BASE64" ]]; then
            python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          try:
              data = base64.b64decode("".join(os.environ["AI_GATEWAY_DEBUG_KEYSTORE_BASE64"].split()), validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit("AI_GATEWAY_DEBUG_KEYSTORE_BASE64 must contain a base64-encoded Android debug keystore.") from None
          if not data:
              raise SystemExit("The debug keystore secret decoded to an empty file.")
          directory = Path.home() / ".android"
          directory.mkdir(mode=0o700, exist_ok=True)
          descriptor = os.open(directory / "debug.keystore", os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "wb") as output:
              os.fchmod(output.fileno(), 0o600)
              output.write(data)
          PY
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey > /dev/null 2>&1 || {
                echo '::error::The secret must be a standard Android debug keystore (store/key password android, alias androiddebugkey).'
                exit 1
              }
            echo 'mode=persistent' >> "$GITHUB_OUTPUT"
          fi

      - name: Report debug signing mode
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode || 'ephemeral' }}
        run: |
          if [[ "$SIGNING_MODE" == 'persistent' ]]; then
            echo 'Using the project debug key. Keep this key unchanged for upgrade-compatible APKs.'
          else
            echo '::warning::No persistent debug key is used (secret unset or PR build). An ephemeral debug key will be generated by Android tooling. Switching keys requires uninstalling the app, deleting invitation credentials; a one-use invitation cannot be redeemed again. Configure AI_GATEWAY_DEBUG_KEYSTORE_BASE64 before distributing upgradeable builds.'
          fi

      - name: Test gateway routing and build debug APKs
        working-directory: V2rayNG
        run: |
          ./gradlew --no-daemon --console=plain testPlaystoreDebugUnitTest \
            --tests 'com.v2ray.ang.util.GatewayRuleFileTest' \
            --tests 'com.v2ray.ang.util.Invitation*Test' \
            --tests 'com.v2ray.ang.core.GatewayRoutingTest' \
            --tests 'com.v2ray.ang.core.ServiceLifecycleTest' \
            --tests 'com.v2ray.ang.core.Invitation*Test' \
            --tests 'com.v2ray.ang.handler.GatewaySettingsTest' \
            --tests 'com.v2ray.ang.util.GatewayGeoFilesTest' \
            --tests 'com.v2ray.ang.viewmodel.UserAssetViewModelTest' \
            --tests 'com.v2ray.ang.HttpUtilTest' \
            assemblePlaystoreDebug

      - name: Remove runner debug signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

      - name: Package named debug downloads
        id: package
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          source = Path("V2rayNG/app/build/outputs/apk/playstore/debug")
          metadata = json.loads((source / "output-metadata.json").read_text())
          elements = metadata["elements"]
          versions = {element["versionName"] for element in elements}
          if len(versions) != 1:
              raise SystemExit("Expected one APK version.")
          version = versions.pop()
          if not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z.+-]*", version):
              raise SystemExit("APK version is not safe for a download filename.")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Version tag must match the APK version: v{version}")

          destination = Path("debug-downloads")
          destination.mkdir()
          seen = set()
          checksums = []
          for element in elements:
              filters = element["filters"]
              abi = next((item["value"] for item in filters if item["filterType"] == "ABI"), "universal")
              if abi not in {"universal", "arm64-v8a", "armeabi-v7a", "x86_64", "x86"} or abi in seen:
                  raise SystemExit("Unexpected or duplicate APK ABI.")
              seen.add(abi)
              original = element["outputFile"]
              if Path(original).name != original or not original.endswith(".apk"):
                  raise SystemExit("Unexpected APK output path.")
              filename = f"AiGateway-{version}-debug-{abi}.apk"
              target = destination / filename
              shutil.copyfile(source / original, target)
              checksums.append(f"{hashlib.sha256(target.read_bytes()).hexdigest()}  {filename}\n")
          if seen != {"universal", "arm64-v8a", "armeabi-v7a", "x86_64", "x86"}:
              raise SystemExit("Expected a universal debug APK and all four ABI APKs.")
          (destination / "SHA256SUMS").write_text("".join(sorted(checksums)))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
              output.write(f"universal_file=AiGateway-{version}-debug-universal.apk\n")
              output.write(f"artifact_name=AiGateway-{version}-debug-apks-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}\n")
          PY

      - name: Upload debug APKs
        id: apks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: debug-downloads/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Show download instructions
        env:
          ARTIFACT_URL: ${{ steps.apks.outputs.artifact-url }}
          UNIVERSAL_FILE: ${{ steps.package.outputs.universal_file }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode || 'ephemeral' }}
        run: |
          {
            echo '## AiGateway debug APK downloads'
            printf '\n[Download APK artifact ZIP](%s) (retained for 30 days).\n' "$ARTIFACT_URL"
            printf '\nFor any supported Android device, unzip and install `%s`.\n' "$UNIVERSAL_FILE"
            echo 'The ZIP also includes per-ABI APKs and SHA256SUMS.'
            echo 'The invitation service address is baked in by the operator; customers do not enter an address.'
            echo '**Debug builds only, not production-signed releases.**'
            if [[ "$SIGNING_MODE" == 'persistent' ]]; then
              echo 'Signed with the optional project debug key. Upgrades preserve app data when the installed APK uses this same key and Android version requirements are met.'
            else
              echo '**Ephemeral debug key:** updating an older installation may require uninstalling it first, deleting app data and invitation credentials. One-use invitations cannot be redeemed again.'
            fi
            echo 'Push a version tag matching the app version (for example v0.1.0) to publish the universal debug APK as a GitHub prerelease.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            V2rayNG/app/build/reports/tests/testPlaystoreDebugUnitTest/
            V2rayNG/app/build/test-results/testPlaystoreDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  publish-debug-prerelease:
    name: Publish universal debug APK
    needs: debug
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested debug APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.debug.outputs.artifact_name }}
          path: debug-downloads

      - name: Verify and publish universal debug APK
        working-directory: debug-downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.debug.outputs.version }}
          UNIVERSAL_FILE: ${{ needs.debug.outputs.universal_file }}
          SIGNING_MODE: ${{ needs.debug.outputs.signing_mode }}
        run: |
          sha256sum --check SHA256SUMS
          sha256sum "$UNIVERSAL_FILE" > "$UNIVERSAL_FILE.sha256"
          cat > release-notes.txt <<'EOF'
          ## Universal debug APK

          Download the `debug-universal.apk` asset below, not the source-code ZIP.
          The invitation service address is built in; customers do not configure an address.
          This is a debug-signed testing build, **not a production-signed release**.
          The accompanying `.sha256` file verifies download integrity, not publisher identity.
          EOF
          if [[ "$SIGNING_MODE" == 'persistent' ]]; then
            printf '\nSigned with the project debug key. Upgrades from APKs using the same key preserve app data, subject to Android version requirements. Keep this key unchanged.\n' >> release-notes.txt
          else
            printf '\n**Ephemeral debug key:** installing over an older build may require uninstalling it first, deleting app data and invitation credentials. One-use invitations cannot be redeemed again.\n' >> release-notes.txt
          fi
          # Never overwrite an existing published version on a workflow rerun.
          gh release create "$TAG" "$UNIVERSAL_FILE" "$UNIVERSAL_FILE.sha256" \
            --verify-tag --prerelease --latest=false \
            --title "AiGateway $VERSION — debug preview" \
            --notes-file release-notes.txt
