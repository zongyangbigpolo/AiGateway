# Add these zones inside the existing http {} block:
# limit_req_zone $binary_remote_addr zone=aigateway_invite:1m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=aigateway_entitlement:1m rate=60r/m;
#
# Include this file inside the existing HTTPS server {} block.
# Keep the existing certificate renewal, other locations, and site configuration.

location = /v1/invitations/redeem {
    limit_req zone=aigateway_invite burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    client_body_timeout 5s;
    access_log off;
    error_log /dev/null;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:18084;
    proxy_set_header Host $host;
}

location = /v1/entitlements/validate {
    limit_req zone=aigateway_entitlement burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    client_body_timeout 5s;
    access_log off;
    error_log /dev/null;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:18084;
    proxy_set_header Host $host;
}

location ^~ /v1/subscriptions/ {
    limit_req zone=aigateway_invite burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    client_body_timeout 5s;
    access_log off;
    error_log /dev/null;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:18084;
    proxy_set_header Host $host;
}
